name: Build and publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
          extra-repositories: https://carpentries.r-universe.dev
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Install lesson and Workbench dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          packages: |
            github::carpentries/sandpaper@0.20.2
            github::carpentries/varnish@1.1.1
            any::rmarkdown
            any::jsonlite
            any::tidyverse
            any::hexbin
            any::patchwork
            any::gridExtra
            bioc::SummarizedExperiment
            bioc::tidySummarizedExperiment
            any::sessioninfo
      - name: Build the French lesson
        run: Rscript scripts/build.R
      - name: Upload the site for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
